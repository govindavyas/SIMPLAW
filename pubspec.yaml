name: simplaw
description: "SIMPLAW is your trusted AI companion, transforming complex legal, financial, and bureaucratic documents into clear, human-readable explanations with natural voice narration, helping you understand what truly matters."
publish_to: "none"
version: 1.0.0

environment:
  sdk: ^3.6.0

dependencies:
  syncfusion_flutter_pdf: ^31.0.0
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0
  provider: ^6.1.2
  go_router: ^16.2.0
  http: ^1.0.0
  file_picker: '>=8.1.2'
  shared_preferences: ^2.0.0
  uuid: ^4.0.0
  audioplayers: ^6.0.0
  path_provider: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icons/dreamflow_icon.jpg
  remove_alpha_ios: true
